name: release
on:
  push: {tags: ['v*']}
permissions: {contents: read}
jobs:
  verify:
    uses: ./.github/workflows/ci.yaml
  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    strategy:
      matrix:
        include:
          - {name: selfmail, context: '.', target: runtime}
          - {name: selfmail-postfix, context: deploy/postfix, target: ''}
          - {name: selfmail-postgres, context: deploy/postgres, target: ''}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: '${{ matrix.context }}'
          target: '${{ matrix.target }}'
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: 'ghcr.io/elmar006/${{ matrix.name }}:${{ github.ref_name }}'
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/Elmar006/selfmail
            org.opencontainers.image.revision=${{ github.sha }}
