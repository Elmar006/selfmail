global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: ['alertmanager:9093']}]
scrape_configs:
  - job_name: selfmail
    static_configs:
      - targets: [api:9090, worker:9090, dispatcher:9090, reconciler:9090, webhooks:9090, bounce:9090, maintainer:9090]
